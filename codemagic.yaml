workflows:
  shree-bileshwar-computer-android:
    name: Shree Bileshwar Computer Android Release

    environment:
      flutter: stable

    scripts:
      - name: Create Android platform
        script: |
          flutter create . --platforms=android --org com.bileshwarcomputer

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
